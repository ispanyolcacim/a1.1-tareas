<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>3. kayıt eşleştirme kontrolü</title><style>body{background:#fff9dc;font:17px system-ui;color:#222;margin:0}main{max-width:680px;margin:24px auto;padding:24px;background:white;border-radius:18px}button,select,textarea{font:inherit;padding:12px;border:1px solid #ccc;border-radius:9px;max-width:100%}button{cursor:pointer;background:#ffdc57;font-weight:bold;margin:4px}textarea{width:90%;height:100px}select{width:100%}small{color:#666}#list{font-size:13px}</style><main><h1>🎙️ 3. kayıt kontrolü</h1><p>Her parçayı dinle. Duyduğun kelimeyi seç ve kaydet. Fazladan tekrar varsa Atla'ya bas. Sonunda eşleşme metnini kopyala.</p><h2 id="number"></h2><small id="time"></small><p><button id="play">🔊 Parçayı dinle</button></p><label for="choice">Duyduğun kelime</label><select id="choice"></select><p><button id="save">✓ Kaydet ve ilerle</button><button id="skip">Atla</button></p><button id="prev">← Önceki</button><button id="next">Sonraki →</button><p id="progress"></p><p id="list"></p><textarea id="output" readonly></textarea><button id="copy">Eşleşmeleri kopyala</button><p id="message" role="status"></p></main><script>const clips=[[0.78,1.3],[2.5,3.02],[4.08,4.52],[5.86,6.26],[7.26,8.06],[8.98,9.76],[10.72,11.26],[12.5,12.88],[14.2,14.94],[15.98,16.68],[17.46,18.12],[19.06,19.56],[20.98,22.02],[25.94,26.76],[27.7,28.3],[29.32,29.9],[30.94,31.18],[32.46,33.16],[34.24,35.18],[36.92,37.44],[38.62,39.14],[40.38,41.36],[42.36,43.32],[44.44,45.14],[46.24,47.02],[48.1,49.02],[50.14,51.14],[52.46,53.14],[54,54.74],[55.56,56.22],[57.32,58.1],[58.9,59.68],[60.66,61.4],[62.38,62.94],[63.88,64.46],[65.32,65.9],[66.86,67.34],[68.44,68.96],[70.08,72.28],[73.36,73.96],[74.98,75.44],[76.62,77.12],[78.14,78.86],[79.72,80.58],[81.5,82.8],[83.82,84.38],[85.7,86.18],[87.42,87.94],[89.1,90.06],[91.08,91.76]],words=["siete","tomate","tío","uno","ugandés","urgente","vaca","vale","vacuna","la vaca","vivir","baca","waterpolo","windsurf","whisky","web","Wagner","wolframio","taxi","tax","experimentar","xilófono","México","mexicano","mexicana","mexicanismo","yogur","leyes","yate","ley","hoy","Ankara y Antalya","zapato","zurro","zurdo","lluvia","llave","Me llamo Hazel.","calle","chico","churro","chantaje","país"];let i=0,assign=Array(clips.length).fill(null),ctx,buf,playing;const el=x=>document.getElementById(x);function render(){el('number').textContent=(i+1)+' / '+clips.length;el('time').textContent=clips[i].join(' – ')+' sn';const used=new Set(assign.filter(v=>v!==null&&v>=0));let j=words.findIndex((_,n)=>!used.has(n));el('choice').replaceChildren(new Option('Fazladan kayıt / atla','-1'),...words.map((w,n)=>new Option((used.has(n)&&assign[i]!==n?'✓ ':'')+w,n)));el('choice').value=String(assign[i]??j);el('progress').textContent=used.size+' / '+words.length+' kelime eşleşti';el('list').textContent=assign.map((v,n)=>v===null?'':(n+1)+': '+(v===-1?'ATLA':words[v])).filter(Boolean).join(' · ');el('output').value=JSON.stringify(Object.fromEntries(assign.flatMap((v,n)=>v!==null&&v>=0?[[words[v],n+1]]:[])));el('prev').disabled=i===0;el('next').disabled=i===clips.length-1}async function play(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!ctx)ctx=new AC();await ctx.resume();if(!buf)buf=await ctx.decodeAudioData(await (await fetch('alfabe-3.mp3')).arrayBuffer());if(playing)try{playing.stop()}catch{}playing=ctx.createBufferSource();playing.buffer=buf;playing.connect(ctx.destination);const [a,b]=clips[i];playing.start(0,Math.max(0,a-.25),b-a+.55)}catch(e){el('message').textContent='Ses açılamadı: '+e.message}}function save(v){assign[i]=v;if(i<clips.length-1)i++;render()}el('play').onclick=play;el('save').onclick=()=>save(Number(el('choice').value));el('skip').onclick=()=>save(-1);el('prev').onclick=()=>{if(i>0)i--;render()};el('next').onclick=()=>{if(i<clips.length-1)i++;render()};el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('output').value);el('message').textContent='Eşleşmeler kopyalandı; sohbete yapıştır.'}catch{el('output').select();el('message').textContent='Kutudaki metni kopyala.'}};render();</script></html>
