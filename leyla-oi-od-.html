<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> · İspanyolca Sınavı · Leyla</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@600;700&display=swap');

:root {
  --pink:   #FFD6E8;
  --blue:   #BDE0FE;
  --purple: #CDB4DB;
  --yellow: #FFF1B6;
  --dark:   #2B2D42;
  --pink-d: #e8a8c8;
  --blue-d: #8ab8e8;
  --purple-d: #a880c0;
  --yellow-d: #e8d060;
  --white:  #FFFFFF;
  --text:   #2B2D42;
  --muted:  #7a7d99;
  --border: rgba(43,45,66,0.12);
  --correct-bg: #d4edda;
  --correct: #2d6a4f;
  --wrong-bg: #fde8e8;
  --wrong: #c0392b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--pink);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.6s ease;
}

/* ── HEADER ── */
.header {
  background: var(--dark);
  padding: 32px 24px 28px;
  text-align: center;
  position: relative;
}
.header-tag {
  display: inline-block;
  background: var(--purple);
  color: var(--dark);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  padding: 5px 16px;
  border-radius: 20px;
  margin-bottom: 14px;
}
.header h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(22px, 4vw, 36px);
  color: #fff;
  margin-bottom: 6px;
}
.header p { font-size: 13px; color: rgba(255,255,255,0.55); letter-spacing: 0.5px; }

/* ── SCOREBAR ── */
.scorebar {
  display: flex;
  justify-content: center;
  gap: 0;
  background: var(--dark);
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 0;
}
.score-item {
  flex: 1;
  max-width: 160px;
  text-align: center;
  padding: 14px 8px;
  border-right: 1px solid rgba(255,255,255,0.08);
}
.score-item:last-child { border-right: none; }
.score-item .val {
  font-size: 26px;
  font-weight: 900;
  color: var(--yellow);
  line-height: 1;
}
.score-item .lbl {
  font-size: 10px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 4px;
}

/* ── PROGRESS ── */
.progress-wrap {
  padding: 16px 24px 0;
  max-width: 700px;
  margin: 0 auto;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 6px;
  opacity: 0.7;
}
.progress-bar {
  height: 6px;
  background: rgba(43,45,66,0.15);
  border-radius: 10px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--dark);
  border-radius: 10px;
  width: 0%;
  transition: width 0.5s ease;
}

/* ── MAIN ── */
.main {
  max-width: 700px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}

/* ── SECTION LABEL ── */
.section-label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}
.section-label .pill {
  background: var(--dark);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 5px 14px;
  border-radius: 20px;
}
.section-label .desc {
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
}

/* ── QUESTION CARD ── */
.q-card {
  background: var(--white);
  border-radius: 20px;
  padding: 28px 28px 24px;
  box-shadow: 0 4px 20px rgba(43,45,66,0.10);
  animation: slideIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  position: relative;
  overflow: hidden;
}
.q-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(30px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.q-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}
.q-num-badge {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  font-weight: 900;
  color: var(--dark);
  flex-shrink: 0;
}
.q-tag-badge {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 20px;
  background: rgba(43,45,66,0.07);
  color: var(--muted);
}

.reading-box {
  background: #f8f6fc;
  border-left: 3px solid var(--purple);
  border-radius: 10px;
  padding: 16px 18px;
  margin-bottom: 18px;
  font-size: 13px;
  line-height: 2;
  color: #444;
  font-weight: 500;
}

.q-text {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.6;
  color: var(--dark);
  margin-bottom: 20px;
}

/* ── OPTIONS ── */
.options { display: flex; flex-direction: column; gap: 10px; }

.option {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  border: 2px solid rgba(43,45,66,0.12);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.2s;
  background: #fafafa;
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--dark);
  width: 100%;
  text-align: left;
}
.option:hover:not(:disabled) {
  border-color: var(--purple-d);
  background: var(--purple);
  transform: translateX(4px);
}
.option.selected {
  border-color: var(--blue-d);
  background: var(--blue);
}
.option.correct {
  border-color: var(--correct);
  background: var(--correct-bg);
  color: var(--correct);
}
.option.wrong {
  border-color: var(--wrong);
  background: var(--wrong-bg);
  color: var(--wrong);
}
.option.show-correct {
  border-color: var(--correct);
  background: var(--correct-bg);
  color: var(--correct);
}
.option:disabled { cursor: default; transform: none !important; }

.opt-letter {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: rgba(43,45,66,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  font-weight: 900;
  flex-shrink: 0;
  text-transform: uppercase;
  transition: all 0.2s;
}
.option.correct .opt-letter { background: var(--correct); color: #fff; }
.option.wrong .opt-letter   { background: var(--wrong); color: #fff; }
.option.show-correct .opt-letter { background: var(--correct); color: #fff; }

/* ── CHECK BTN ── */
.check-btn {
  margin-top: 20px;
  width: 100%;
  padding: 14px;
  background: var(--dark);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-family: 'Nunito', sans-serif;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.2s;
}
.check-btn:hover:not(:disabled) { background: #3d4060; transform: translateY(-1px); }
.check-btn:disabled { background: rgba(43,45,66,0.2); color: rgba(43,45,66,0.4); cursor: default; transform: none; }

/* ── EXPLANATION ── */
.explanation {
  display: none;
  margin-top: 16px;
  padding: 14px 16px;
  background: var(--blue);
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.8;
  color: #1a3a5c;
  font-weight: 600;
}
.explanation.show { display: block; }

/* ── NEXT BTN ── */
.next-btn {
  display: none;
  margin-top: 12px;
  width: 100%;
  padding: 14px;
  background: var(--purple);
  color: var(--dark);
  border: none;
  border-radius: 14px;
  font-family: 'Nunito', sans-serif;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.3px;
}
.next-btn:hover { background: var(--purple-d); color: #fff; transform: translateY(-1px); }
.next-btn.show { display: block; }

/* ── WRITING ── */
.writing-outer {
  display: none;
  animation: slideIn 0.4s ease;
}
.writing-outer.show { display: block; }

.writing-card {
  background: var(--white);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(43,45,66,0.10);
}
.writing-header {
  background: var(--dark);
  color: #fff;
  padding: 28px;
}
.writing-header h3 {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  margin-bottom: 6px;
}
.writing-header p { font-size: 13px; opacity: 0.6; }

.writing-body { padding: 28px; }

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}
@media (max-width: 560px) { .info-grid { grid-template-columns: 1fr; } }

.info-field label {
  display: block;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.info-field input {
  width: 100%;
  padding: 11px 14px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--dark);
  background: #fafafa;
  outline: none;
  transition: border-color 0.2s;
}
.info-field input:focus { border-color: var(--purple-d); background: #fff; }
.info-field input[readonly] { opacity: 0.55; cursor: default; }

.w-section-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
  display: block;
}

.w-guide {
  background: var(--yellow);
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 20px;
  font-size: 13px;
  line-height: 1.9;
  font-weight: 600;
  color: #5a4a00;
}
.w-guide h4 {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #7a6200;
  margin-bottom: 10px;
}
.w-guide ul { padding-left: 18px; }
.w-guide li { margin-bottom: 3px; }

.checklist {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 24px;
}
@media (max-width: 560px) { .checklist { grid-template-columns: 1fr; } }
.check-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  background: #fafafa;
  padding: 9px 12px;
  border-radius: 10px;
  border: 2px solid var(--border);
  cursor: pointer;
}
.check-item input[type=checkbox] { accent-color: var(--dark); margin-top: 1px; flex-shrink:0; }

textarea.writing-area {
  width: 100%;
  min-height: 480px;
  padding: 20px;
  border: 2px solid var(--border);
  border-radius: 14px;
  font-family: 'Nunito', sans-serif;
  font-size: 15px;
  font-weight: 600;
  line-height: 2;
  color: var(--dark);
  background: #fafafa;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
  margin-bottom: 8px;
}
textarea.writing-area:focus { border-color: var(--purple-d); background: #fff; }

.word-counter {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  text-align: right;
  margin-bottom: 24px;
}

.rubric {
  border: 2px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  margin-top: 8px;
}
.rubric-header {
  background: var(--dark);
  color: #fff;
  padding: 14px 18px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.rubric table { width: 100%; border-collapse: collapse; font-size: 13px; }
.rubric th {
  background: #f5f5f7;
  padding: 10px 16px;
  text-align: left;
  font-weight: 800;
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 2px solid var(--border);
}
.rubric td {
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  line-height: 1.5;
  font-weight: 600;
}
.rubric tr:last-child td { border-bottom: none; font-weight: 900; background: var(--yellow); }
.rubric td:last-child { text-align: center; color: var(--dark); white-space: nowrap; }

/* ── FINAL ── */
.final-card {
  display: none;
  text-align: center;
  background: var(--dark);
  border-radius: 20px;
  padding: 40px 28px;
  margin-bottom: 32px;
  animation: slideIn 0.5s ease;
}
.final-card.show { display: block; }
.final-card .big {
  font-family: 'Playfair Display', serif;
  font-size: 72px;
  color: var(--yellow);
  line-height: 1;
}
.final-card .label { color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 8px; font-weight: 700; }
.final-card .msg { color: #fff; font-size: 18px; font-weight: 800; margin-top: 14px; }

@media (max-width: 560px) {
  .q-card { padding: 20px 16px; }
  .writing-body { padding: 20px 16px; }
  .main { padding: 24px 14px 60px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-tag"> · Español · Leyla</div>
  <h1>Yakın Gelecek Zamanı Sınavı</h1>
  <p>IR A + Infinitivo &nbsp;·&nbsp; Objeto Directo e Indirecto &nbsp;·&nbsp; Dönüşlü Fiiller</p>
</div>

<div class="scorebar">
  <div class="score-item"><div class="val" id="sc-correct">0</div><div class="lbl">Doğru</div></div>
  <div class="score-item"><div class="val" id="sc-wrong">0</div><div class="lbl">Yanlış</div></div>
  <div class="score-item"><div class="val" id="sc-remain">100</div><div class="lbl">Kalan</div></div>
  <div class="score-item"><div class="val" id="sc-pct">—</div><div class="lbl">Puan</div></div>
</div>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="prog-label">Soru 1 / 100</span>
    <span id="prog-pct">0%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
</div>

<div class="main">
  <div id="q-display"></div>
  <div class="final-card" id="final-card">
    <div class="big" id="final-score">—</div>
    <div class="label">100 Soru Üzerinden Puan</div>
    <div class="msg" id="final-msg"></div>
  </div>
  <div class="writing-outer" id="writing-outer">
    <!-- writing section injected by JS -->
  </div>
</div>

<script>
// ===== PALETTE =====
const bgColors = ['#FFD6E8','#BDE0FE','#CDB4DB','#FFF1B6'];
const cardAccents = ['#FFD6E8','#BDE0FE','#CDB4DB','#FFF1B6'];
const letters = ['a','b','c','d'];

// ===== ALL QUESTIONS =====
const allQuestions = [
  // 1-20 IR A
  { n:1,  tag:"IR A",      text:'Mañana yo ______ español en casa.', opts:['voy a estudiar','estudio','voy estudiar','estudiar voy'], ans:0, exp:'<strong>voy + a + estudiar</strong> → yakın gelecek yapısı. "Yo" öznesiyle ir = <em>voy</em>. Türkçesi: Yarın evde İspanyolca çalışacağım.' },
  { n:2,  tag:"IR A",      text:'Nosotros ______ una película esta noche.', opts:['vemos','vamos ver','vamos a ver','ver vamos'], ans:2, exp:'"Bu gece bir film izleyeceğiz." <strong>vamos + a + ver</strong> → nosotros için ir = vamos, ardından mutlaka <em>a</em> gelir.' },
  { n:3,  tag:"IR A",      text:'Ellos ______ al cine el sábado.', opts:['van ir','van a ir','ir van','van a van'], ans:1, exp:'<strong>van a ir</strong> → ilk <em>van</em> ir fiilinin çekimidir, ikinci <em>ir</em> mastardır.' },
  { n:4,  tag:"IR A",      text:'Tú ______ a tu madre después de la clase.', opts:['llamas','vas llamar','llamar vas','vas a llamar'], ans:3, exp:'"tú" için <strong>vas + a + llamar</strong>. Türkçesi: Dersten sonra anneni arayacaksın.' },
  { n:5,  tag:"IR A",      text:'María ______ una carta mañana.', opts:['escribe','va escribir','escribir va','va a escribir'], ans:3, exp:'María üçüncü tekil şahıs → <em>va</em>. Yapı: <strong>va + a + escribir</strong>.' },
  { n:6,  tag:"Dönüşlü",  text:'Vosotros ______ temprano mañana.', opts:['vais levantar','vais a levantaros','levantáis','levantar vais'], ans:1, exp:'<em>levantarse</em> dönüşlü fiil. "Vosotros" için zamir <em>os</em>; mastara eklenir → <strong>levantaros</strong>. Türkçesi: Siz yarın erken kalkacaksınız.' },
  { n:7,  tag:"IR A",      text:'Ella ______ café después del desayuno.', opts:['toma','va tomar','va a tomar','tomar va'], ans:2, exp:'"Ella" için <em>va</em>. Doğru yapı: <strong>va + a + tomar</strong>.' },
  { n:8,  tag:"Dönüşlü",  text:'Yo ______ en casa este fin de semana.', opts:['voy a quedarme','quedo','voy quedar','quedarme voy'], ans:0, exp:'<em>quedarse</em> dönüşlü fiil. "Yo" için zamir <em>me</em> → <strong>voy a quedarme</strong>.' },
  { n:9,  tag:"IR A",      text:'Mis amigos ______ fútbol el domingo.', opts:['van a jugar','juegan','van jugar','jugar van'], ans:0, exp:'Çoğul özne → <em>van</em>. Doğru yapı: <strong>van + a + jugar</strong>.' },
  { n:10, tag:"IR A",      text:'¿Tú ______ la tarea ahora o más tarde?', opts:['haces','vas hacer','hacer vas','vas a hacer'], ans:3, exp:'Sorularda yapı değişmez: <strong>vas + a + hacer</strong>.' },
  { n:11, tag:"Olumsuz",   text:'Nosotros no ______ mañana.', opts:['viajamos','vamos a viajar','vamos viajar','viajar vamos'], ans:1, exp:'Olumsuzda <em>no</em> çekimli fiilden önce: <strong>no + vamos + a + viajar</strong>. Türkçesi: Biz yarın seyahat etmeyeceğiz.' },
  { n:12, tag:"IR A",      text:'Lucía ______ una chaqueta nueva.', opts:['compra','va comprar','va a comprar','comprar va'], ans:2, exp:'<strong>va + a + comprar</strong>. Comprar mastar hâlde kalır.' },
  { n:13, tag:"IR A",      text:'Yo ______ después del trabajo.', opts:['descanso','voy descansar','voy a descansar','descansar voy'], ans:2, exp:'"Yo" için <em>voy</em>. Doğru yapı: <strong>voy + a + descansar</strong>.' },
  { n:14, tag:"IR A",      text:'Tú ______ un correo al profesor.', opts:['vas a escribir','escribes','vas escribir','escribir vas'], ans:0, exp:'<strong>vas + a + escribir</strong>. <em>un correo</em> = OD, <em>al profesor</em> = OI.' },
  { n:15, tag:"IR A",      text:'Los niños ______ en el parque esta tarde.', opts:['juegan','van jugar','jugar van','van a jugar'], ans:3, exp:'Çoğul özne → <em>van</em>. Doğru yapı: <strong>van + a + jugar</strong>.' },
  { n:16, tag:"IR A",      text:'Nosotros ______ la cena juntos.', opts:['preparamos','vamos a preparar','vamos preparar','preparar vamos'], ans:1, exp:'<strong>vamos + a + preparar</strong>. İkinci fiil mastar kalır.' },
  { n:17, tag:"IR A",      text:'Marta ______ a sus abuelos mañana.', opts:['visita','va a visitar','va visitar','visitar va'], ans:1, exp:'<em>personal a</em> kişiler için kullanılır. Yapı: <strong>va + a + visitar</strong>.' },
  { n:18, tag:"IR A",      text:'Ustedes ______ español en la clase.', opts:['hablan','van hablar','hablar van','van a hablar'], ans:3, exp:'<em>Ustedes</em> üçüncü çoğul gibi çekimlenir → <em>van</em>. Doğru yapı: <strong>van + a + hablar</strong>.' },
  { n:19, tag:"Olumsuz",   text:'Yo no ______ café esta noche.', opts:['voy a beber','bebo','voy beber','beber voy'], ans:0, exp:'Olumsuz yakın gelecek: <strong>no + voy + a + beber</strong>. Türkçesi: Bu gece kahve içmeyeceğim.' },
  { n:20, tag:"IR A",      text:'¿Vosotros ______ mañana por la mañana?', opts:['salís','vais salir','vais a salir','salir vais'], ans:2, exp:'"Vosotros" için <em>vais</em>. Doğru yapı: <strong>vais + a + salir</strong>.' },

  // 21-30 OKUMA
  { n:21, tag:"Okuma", reading:`Mañana Clara va a tener un día muy ocupado. Primero va a levantarse a las siete. Después va a ducharse rápidamente. No va a desayunar en casa. Va a tomar un café cerca de la oficina. A las nueve va a empezar una reunión importante. Su jefe va a explicar un nuevo proyecto. Clara va a tomar muchas notas. Después de la reunión, va a llamar a un cliente. También va a mandarle un correo. Al mediodía va a comer con sus compañeros. Por la tarde va a revisar varios documentos. Luego va a volver a casa en metro. Por la noche no va a salir. Va a acostarse temprano porque está cansada.`,
    text:'¿Qué va a hacer Clara por la noche?', opts:['Va a ir al cine.','Va a llamar a su jefe.','Va a acostarse temprano.','Va a desayunar en casa.'], ans:2, exp:'Metnin sonunda: <em>Va a acostarse temprano porque está cansada.</em> <strong>acostarse</strong> = dönüşlü fiil, "yatacak" anlamına gelir.' },
  { n:22, tag:"Okuma", reading:`El sábado Daniel va a visitar a su abuela. Va a salir de casa a las diez. Primero va a comprar flores. También va a comprar pan y fruta. Su abuela vive cerca del centro. Daniel va a ir en autobús. Va a llegar antes del mediodía. Su abuela va a preparar sopa. Daniel va a ayudarla en la cocina. Después van a comer juntos. Luego van a ver fotos antiguas. Daniel va a escuchar muchas historias familiares. Por la tarde va a arreglar una lámpara. Antes de salir, va a darle un abrazo a su abuela. Por la noche va a volver a su casa.`,
    text:'¿Qué va a comprar Daniel antes de visitar a su abuela?', opts:['Flores, pan y fruta.','Una lámpara nueva.','Un libro antiguo.','Un billete de tren.'], ans:0, exp:'Metinde: <em>va a comprar flores</em> ve <em>va a comprar pan y fruta</em>.' },
  { n:23, tag:"Okuma", reading:`Mañana por la mañana Ana va a estudiar en la biblioteca. Va a llevar su ordenador. También va a llevar dos libros grandes. Primero va a buscar información para una presentación. Después va a escribir una introducción. Su amiga Marta va a ayudarla. Marta va a explicarle algunas ideas difíciles. Ana va a entender mejor el tema. Luego las dos van a preparar unas diapositivas. No van a terminar todo por la mañana. Por eso van a continuar después de comer. A las tres van a revisar el texto. A las cinco van a mandar el trabajo al profesor. Después van a tomar café. Finalmente van a volver a casa.`,
    text:'¿Quién va a ayudar a Ana?', opts:['Su profesor.','Su hermano.','Su madre.','Su amiga Marta.'], ans:3, exp:'Metinde açıkça: <em>Su amiga Marta va a ayudarla.</em> <em>-la</em> = Ana\'yı temsil eden OD zamiri.' },
  { n:24, tag:"Okuma", reading:`El domingo Luis va a limpiar su apartamento. Primero va a abrir las ventanas. Después va a poner música. Va a limpiar la cocina. También va a lavar los platos. Luego va a ordenar el salón. Va a guardar los libros en la estantería. Su hermana va a llamarlo por teléfono. Luis va a contestarle rápidamente. Después va a preparar una comida sencilla. No va a salir por la tarde. Va a quedarse en casa. A las seis va a ver una película. Antes de dormir va a leer un poco. Finalmente va a acostarse a las once.`,
    text:'¿Qué va a hacer Luis a las seis?', opts:['Va a lavar los platos.','Va a ver una película.','Va a llamar a su hermana.','Va a abrir las ventanas.'], ans:1, exp:'Metinde: <em>A las seis va a ver una película.</em> <strong>va a ver</strong> = "izleyecek".' },
  { n:25, tag:"Okuma", reading:`Esta tarde Elena va a preparar una cena especial. Sus amigos van a venir a su casa. Primero Elena va a ir al mercado. Va a comprar verduras frescas. También va a comprar queso y pan. Después va a volver a casa. Va a lavarse las manos. Luego va a cortar las verduras. Su hermano va a ayudarla. Él va a poner la mesa. Elena va a preparar una ensalada. También va a cocinar pasta. A las ocho sus amigos van a llegar. Todos van a cenar juntos. Después van a hablar y escuchar música.`,
    text:'¿Qué va a hacer el hermano de Elena?', opts:['Va a cocinar pasta.','Va a poner la mesa.','Va a comprar verduras.','Va a lavar los platos.'], ans:1, exp:'Metinde: <em>Él va a poner la mesa.</em> = "Masayı kuracak."' },
  { n:26, tag:"Okuma", reading:`Mañana Marcos va a viajar a Valencia. Va a levantarse muy temprano. Va a ducharse y vestirse rápido. No va a desayunar mucho. Va a tomar solo un café. Después va a salir de casa a las siete. Va a ir a la estación en taxi. Allí va a comprar un billete. El tren va a salir a las ocho. Durante el viaje va a leer una novela. También va a escribir mensajes a sus amigos. Cuando llegue, va a visitar un museo. Después va a comer paella. Por la tarde va a caminar por el centro. Por la noche va a dormir en un hotel.`,
    text:'¿Qué va a hacer Marcos durante el viaje?', opts:['Va a cocinar paella.','Va a comprar ropa.','Va a leer una novela.','Va a dormir en casa.'], ans:2, exp:'Metinde: <em>Durante el viaje va a leer una novela.</em>' },
  { n:27, tag:"Okuma", reading:`Esta noche Laura va a estudiar para un examen. Primero va a organizar sus apuntes. Después va a leer tres capítulos. Va a subrayar las ideas importantes. También va a escribir un resumen. Su compañera Paula va a llamarla. Laura va a explicarle una parte del tema. Luego las dos van a practicar preguntas. No van a mirar el móvil. Van a concentrarse en el examen. A las diez Laura va a descansar un poco. Va a tomar té. Después va a repasar los verbos. Antes de dormir va a preparar su mochila. Finalmente va a acostarse temprano.`,
    text:'¿Qué va a preparar Laura antes de dormir?', opts:['Su mochila.','Una cena especial.','Una presentación.','Un regalo.'], ans:0, exp:'Metinde: <em>Antes de dormir va a preparar su mochila.</em>' },
  { n:28, tag:"Okuma", reading:`El viernes mis padres van a cenar fuera. Primero van a reservar una mesa. Después mi madre va a elegir un vestido. Mi padre va a ponerse una camisa azul. Van a salir de casa a las ocho. Van a ir al restaurante en coche. El camarero va a recibirlos en la entrada. Mis padres van a pedir pescado. También van a pedir una ensalada. Después van a compartir un postre. Mi padre va a pagar la cuenta. Mi madre va a darle las gracias al camarero. Luego van a caminar un poco. Van a volver a casa a las once. Finalmente van a descansar.`,
    text:'¿Qué va a pedir la pareja en el restaurante?', opts:['Carne y arroz.','Pizza y sopa.','Pasta y café.','Pescado y una ensalada.'], ans:3, exp:'Metinde: <em>van a pedir pescado</em> ve <em>van a pedir una ensalada</em>.' },
  { n:29, tag:"Okuma", reading:`Mañana los estudiantes van a hacer una presentación. Primero van a llegar temprano a clase. Van a abrir sus ordenadores. También van a revisar las diapositivas. La profesora va a escucharlos con atención. Pedro va a explicar la introducción. Sara va a hablar sobre los ejemplos. Carlos va a mostrar unas fotos. Después todos van a responder preguntas. La profesora va a darles algunos consejos. Los estudiantes van a tomar notas. No van a terminar tarde. Después de la clase van a comer juntos. Luego van a descansar un poco. Por la tarde van a estudiar otro tema.`,
    text:'¿Qué va a hacer la profesora después de la presentación?', opts:['Va a mostrar fotos.','Va a comer sola.','Va a abrir su ordenador.','Va a darles algunos consejos.'], ans:3, exp:'Metinde: <em>La profesora va a darles algunos consejos.</em> <em>-les</em> = öğrencilere.' },
  { n:30, tag:"Okuma", reading:`Este fin de semana Julia va a quedarse en casa. No va a viajar. No va a visitar a nadie. Quiere descansar mucho. El sábado va a levantarse tarde. Después va a preparar un desayuno grande. Va a leer el periódico. Luego va a llamar a su hermana. Va a contarle sus planes. Por la tarde va a ver una serie. También va a ordenar su habitación. El domingo va a cocinar algo sencillo. Va a escuchar música tranquila. Por la noche va a preparar la ropa para el lunes. Finalmente va a acostarse temprano.`,
    text:'¿Qué va a hacer Julia este fin de semana?', opts:['Va a quedarse en casa.','Va a viajar a otra ciudad.','Va a visitar a sus amigos.','Va a trabajar todo el día.'], ans:0, exp:'İlk cümle: <em>Julia va a quedarse en casa.</em> Ayrıca seyahat etmeyeceği de belirtilmiş.' },

  { n:31, tag:"OD",      text:'Voy a comprar el libro mañana. → Zamirli doğru cümle?', opts:['Le voy a comprar mañana.','Me voy a comprar mañana.','Lo voy a comprar mañana.','Se voy a comprar mañana.'], ans:2, exp:'<em>el libro</em> = erkek tekil OD → zamir <strong>lo</strong>.' },
  { n:32, tag:"OD",      text:'Voy a leer la carta esta noche. → Zamirli doğru cümle?', opts:['Lo voy a leer esta noche.','La voy a leer esta noche.','Le voy a leer esta noche.','Me voy a leer esta noche.'], ans:1, exp:'<em>la carta</em> = dişil tekil OD → zamir <strong>la</strong>.' },

  { n:34, tag:"OI",      text:'Voy a escribir a Ana esta tarde. → Zamirli doğru cümle?', opts:['La voy a escribir esta tarde.','Le voy a escribir esta tarde.','Lo voy a escribir esta tarde.','Se voy a escribir esta tarde.'], ans:1, exp:'<em>escribir a alguien</em> → kişi OI olur → <strong>le</strong>.' },
  { n:35, tag:"Dönüşlü", text:'Tú ______ temprano mañana.', opts:['vas levantar','te vas levantar','vas a levantarse','te vas a levantar'], ans:3, exp:'<em>levantarse</em> dönüşlü, "tú" için zamir <em>te</em>. Çekimli fiilden önce: <strong>te vas a levantar</strong>.' },
  { n:36, tag:"Dönüşlü", text:'Ella va a ducharse ahora. → Aynı anlamlı doğru kullanım?', opts:['Ella se va ducharse ahora.','Ella va se a duchar ahora.','Ella se va a duchar ahora.','Ella va a se duchar ahora.'], ans:2, exp:'Zamir iki yere gelebilir: mastara veya çekimli fiilden önce. Doğru: <strong>se va a duchar</strong>.' },
  { n:37, tag:"OD+OI",   text:'Voy a dar el libro a Marta. → İki zamirli doğru cümle?', opts:['Le lo voy a dar.','La lo voy a dar.','Lo le voy a dar.','Se lo voy a dar.'], ans:3, exp:'<em>el libro</em> = lo, <em>a Marta</em> = le. Ama <em>le lo</em> kullanılmaz → <strong>se lo</strong>.' },
  { n:38, tag:"OD+OI",   text:'Vamos a explicar la lección a los estudiantes. → Doğru zamirli cümle?', opts:['Les la vamos a explicar.','La les vamos a explicar.','Se la vamos a explicar.','Los vamos a explicarla.'], ans:2, exp:'<em>la lección</em> = la, <em>a los estudiantes</em> = les → <em>les la</em> olmaz → <strong>se la</strong>.' },

  { n:40, tag:"OD",      text:'¿Vas a comprar la falda? → Zamirli doğru cevap?', opts:['Sí, lo voy a comprar.','Sí, la voy a comprar.','Sí, le voy a comprar.','Sí, se voy a comprar.'], ans:1, exp:'<em>la falda</em> = dişil tekil OD → <strong>la</strong>.' },

  { n:42, tag:"OD",      text:'Voy a llamar a Carlos ahora. → Standart zamirli doğru cümle?', opts:['Lo voy a llamar ahora.','Le voy a llamar ahora.','Se voy a llamar ahora.','Me voy a llamar ahora.'], ans:0, exp:'<em>llamar a alguien</em> → kişi OD olur → Carlos için <strong>lo</strong>.' },
  { n:43, tag:"Dönüşlü", text:'Nosotros ______ para el examen.', opts:['nos vamos preparar','vamos a prepararse','se vamos a preparar','nos vamos a preparar'], ans:3, exp:'<em>prepararse</em> dönüşlü, "nosotros" için zamir <em>nos</em>. <strong>nos vamos a preparar</strong>.' },
  { n:44, tag:"Dönüşlü", text:'Ella va a ponerse el vestido. → Aynı anlamlı doğru cümle?', opts:['Ella va se a poner el vestido.','Ella pone va a el vestido.','Ella se va a poner el vestido.','Ella va a se poner el vestido.'], ans:2, exp:'<em>ponerse</em> dönüşlü → <strong>se va a poner</strong>.' },
  { n:45, tag:"OD",      text:'Voy a comprar los zapatos. → Zamirli doğru cümle?', opts:['Lo voy a comprar.','Las voy a comprar.','Los voy a comprar.','Les voy a comprar.'], ans:2, exp:'<em>los zapatos</em> = erkek çoğul OD → <strong>los</strong>.' },
  { n:46, tag:"OD+OI",   text:'Vamos a enviar las invitaciones a Laura. → İki zamirli doğru cümle?', opts:['Le las vamos a enviar.','Las le vamos a enviar.','Se los vamos a enviar.','Se las vamos a enviar.'], ans:3, exp:'<em>las invitaciones</em> = las, <em>a Laura</em> = le → <em>le las</em> olmaz → <strong>se las</strong>.' },
  { n:47, tag:"OI",      text:'Tú vas a contarme la verdad. → Aynı anlamlı doğru cümle?', opts:['Tú me vas contar la verdad.','Tú me vas a contar la verdad.','Tú lo vas a contarme la verdad.','Tú vas me a contar la verdad.'], ans:1, exp:'<em>-me</em> = "bana". Çekimli fiilden önce: <strong>me vas a contar</strong>.' },
  { n:48, tag:"OD+OI",   text:'Van a dar los documentos al director. → İki zamirli doğru cümle?', opts:['Se los van a dar.','Le los van a dar.','Los le van a dar.','Se las van a dar.'], ans:0, exp:'<em>los documentos</em> = los, <em>al director</em> = le → <strong>se los</strong>.' },

  { n:50, tag:"OD",      text:'¿Vas a leer el correo? → Zamirli doğru cevap?', opts:['Sí, le voy a leer.','Sí, lo voy a leer.','Sí, voy a leerlo.','Sí, me voy a leer.'], ans:2, exp:'<em>el correo</em> = erkek tekil OD → <strong>lo</strong>. <em>voy a leerlo</em> veya <em>lo voy a leer</em>.' },
  { n:51, tag:"OD+OI",   text:'Voy a explicar el problema a mi amiga. → İki zamirli doğru cümle?', opts:['Le lo voy a explicar.','La lo voy a explicar.','Lo le voy a explicar.','Se lo voy a explicar.'], ans:3, exp:'<em>el problema</em> = lo, <em>a mi amiga</em> = le → <strong>se lo</strong>.' },

// tag → card top stripe color
const tagColors = {
  'IR A':      '#BDE0FE',
  'Dönüşlü':  '#CDB4DB',
  'Olumsuz':  '#FFF1B6',
  'Okuma':    '#FFD6E8',
  'OD':       '#BDE0FE',
  'OI':       '#FFF1B6',
  'OD+OI':    '#CDB4DB',
};
const tagNumColors = {
  'IR A':     '#BDE0FE',
  'Dönüşlü': '#CDB4DB',
  'Olumsuz':  '#FFF1B6',
  'Okuma':    '#FFD6E8',
  'OD':       '#BDE0FE',
  'OI':       '#FFF1B6',
  'OD+OI':    '#CDB4DB',
};

// body bg cycle per 20 questions
function getBg(n) {
  if (n <= 20)  return '#FFD6E8';
  if (n <= 30)  return '#BDE0FE';
  if (n <= 60)  return '#FFF1B6';
  if (n <= 80)  return '#CDB4DB';
  return '#BDE0FE';
}

let current = 0;
let correct = 0, wrong = 0;
const display = document.getElementById('q-display');

function updateScore() {
  document.getElementById('sc-correct').textContent = correct;
  document.getElementById('sc-wrong').textContent = wrong;
  const done = correct + wrong;
  document.getElementById('sc-remain').textContent = 100 - done;
  document.getElementById('sc-pct').textContent = done > 0 ? Math.round((correct/100)*100) : '—';

  // progress
  const pct = Math.round((done/100)*100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = done < 100
    ? `Soru ${allQuestions[current]?.n || done+1} / 100`
    : 'Tamamlandı';
  document.getElementById('prog-pct').textContent = pct + '%';
}

function showQuestion(idx) {
  if (idx >= allQuestions.length) {
    showFinal();
    return;
  }
  const q = allQuestions[idx];
  // change body bg
  document.body.style.background = getBg(q.n);

  display.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'q-card';

  const accent = tagColors[q.tag] || '#BDE0FE';
  card.style.cssText = `border-top: 4px solid ${accent};`;

  let html = `<div class="q-top">
    <div class="q-num-badge" style="background:${accent}">${q.n}</div>
    <span class="q-tag-badge">${q.tag}</span>
  </div>`;

  if (q.reading) {
    html += `<div class="reading-box">${q.reading}</div>`;
  }

  html += `<div class="q-text">${q.text}</div>`;
  html += `<div class="options">`;
  q.opts.forEach((opt, i) => {
    html += `<button class="option" data-i="${i}">
      <span class="opt-letter">${letters[i]}</span>
      <span>${opt}</span>
    </button>`;
  });
  html += `</div>`;
  html += `<button class="check-btn" id="check-btn" disabled>Kontrol Et ✓</button>`;
  html += `<div class="explanation" id="exp">${q.exp}</div>`;
  html += `<button class="next-btn" id="next-btn">${idx < allQuestions.length-1 ? 'Sonraki Soru →' : 'Sonuçları Gör 🎉'}</button>`;

  card.innerHTML = html;
  display.appendChild(card);

  let selected = null;

  card.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => {
      if (selected !== null) return;
      card.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selected = parseInt(btn.dataset.i);
      document.getElementById('check-btn').disabled = false;
    });
  });

  document.getElementById('check-btn').addEventListener('click', () => {
    if (selected === null) return;
    const isCorrect = selected === q.ans;
    if (isCorrect) correct++; else wrong++;

    card.querySelectorAll('.option').forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.ans) btn.classList.add('show-correct');
      else if (i === selected && i !== q.ans) btn.classList.add('wrong');
      btn.classList.remove('selected');
    });

    document.getElementById('check-btn').disabled = true;
    document.getElementById('check-btn').style.display = 'none';
    document.getElementById('exp').classList.add('show');
    document.getElementById('next-btn').classList.add('show');
    updateScore();
  });

  document.getElementById('next-btn').addEventListener('click', () => {
    current++;
    showQuestion(current);
    window.scrollTo({top:0, behavior:'smooth'});
  });

  updateScore();
}

function showFinal() {
  display.innerHTML = '';
  document.body.style.background = '#CDB4DB';

  const pct = Math.round((correct/100)*100);
  let msg = '';
  if (pct >= 90) msg = '¡Excelente! Çok başarılısın! 🌟';
  else if (pct >= 70) msg = '¡Muy bien! Harika bir performans! 🎉';
  else if (pct >= 50) msg = '¡Bien! Biraz daha pratik yapalım! 💪';
  else msg = '¡Sigue practicando! Devam et, başarabilirsin! 📚';

  document.getElementById('final-score').textContent = pct;
  document.getElementById('final-msg').textContent = msg;
  document.getElementById('final-card').classList.add('show');

  document.getElementById('prog-label').textContent = 'Tamamlandı! 🎉';
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-pct').textContent = '100%';

  // Show writing section
  buildWriting();
  document.getElementById('writing-outer').classList.add('show');
  setTimeout(() => {
    document.getElementById('writing-outer').scrollIntoView({behavior:'smooth'});
  }, 600);
}
