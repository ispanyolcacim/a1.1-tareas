<script>
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbyq_OLfdF0_TmRKszWrb9U5mydRjsfwadjqsPBFinCAvlmzN7LPJ-92EumF3-PMJu8D-Q/exec';
var ODEV_ADI='H4 – 13-14.Ders';
var GROUPS={'Ali Ceylan': 'A1.1', 'Beyza Nur Yuksel': 'A1.1', 'Aysen Gurkan': 'A1.1', 'Defne Ozer': 'A1.1', 'Defne Sonmez': 'A1.1', 'Ece Utkan': 'A1.1', 'Melisa Tuncer': 'A1.1', 'Sude Selen Ulker': 'A1.1', 'Sule Soylemez Gul': 'A1.1', 'Yelda Yilmaz': 'A1.1'};
var Q=[{"t": "mc", "q": "1. Soru \nTrabajo en una oficina.\nHablo con muchas personas.\nTengo mucha experiencia.\nAhora ______ a muchos clientes. (conocer)", "o": ["conoces", "conozco", "conoce", "conocemos"], "a": 1, "exp": "Doğru cevap: B\nTam Çeviri:\nBir ofiste çalışıyorum.\nBirçok insanla konuşuyorum.\nÇok deneyimim var.\nŞimdi birçok müşteriyi tanıyorum.\nAçıklama:\n\"trabajo, hablo, tengo\" → özne yo\nConocer fiili yo formunda -zco alır → conozco"}, {"t": "mc", "q": "2. Soru \nEstoy en casa.\nNo salgo hoy.\nQuiero descansar.\nAhora ______ tranquilo. (estar)", "o": ["estoy", "está", "estás", "estamos"], "a": 0, "exp": "Doğru cevap: A\nTam Çeviri:\nEvdeyim.\nBugün dışarı çıkmıyorum.\nDinlenmek istiyorum.\nŞimdi sakinim.\nAçıklama:\n\"estoy, no salgo, quiero\" → özne yo\nEstar fiilinin yo çekimi → estoy"}, {"t": "mc", "q": "3. Soru \nTrabajo en una tienda.\nVendo ropa.\nHablo con clientes.\nAhora ______ la respuesta. (saber)", "o": ["sabes", "sabe", "sabemos", "sé"], "a": 3, "exp": "Doğru cevap: D\nTam Çeviri:\nBir mağazada çalışıyorum.\nKıyafet satıyorum.\nMüşterilerle konuşuyorum.\nŞimdi cevabı biliyorum.\nAçıklama:\n\"trabajo, vendo, hablo\" → özne yo\nSaber fiili yo formunda düzensizdir → sé"}, {"t": "mc", "q": "4. Soru \nEstoy en la cocina.\nTengo hambre.\nQuiero comer.\nAhora ______ la comida. (hacer)", "o": ["haces", "hace", "hago", "hacemos"], "a": 2, "exp": "Doğru cevap: C\nTam Çeviri:\nMutfaktayım.\nAçım.\nYemek istiyorum.\nŞimdi yemeği yapıyorum.\nAçıklama:\n\"estoy, tengo, quiero\" → özne yo\nHacer fiili yo formunda → hago"}, {"t": "mc", "q": "5. Soru \nEstoy en casa.\nTengo invitados.\nQuiero preparar la mesa.\nAhora ______ la mesa. (poner)", "o": ["pone", "pones", "pongo", "ponemos"], "a": 2, "exp": "Doğru cevap: C\nTam Çeviri:\nEvdeyim.\nMisafirlerim var.\nMasayı hazırlamak istiyorum.\nŞimdi masayı kuruyorum.\nAçıklama:\n\"estoy, tengo, quiero\" → özne yo\nPoner fiili yo formunda → pongo"}, {"t": "mc", "q": "6. Soru \nTrabajo en una empresa.\nUso var state={cur:0,answered:[],scores:[],okCount:0,errCount:0};
function startQuiz(){
  var name=document.getElementById('introName').value;
  if(!name){alert('Lütfen adınızı seçin.');return;}
  document.getElementById('resName').value=name;
  document.getElementById('resName2').value=name;
  document.getElementById('quizStudentName').textContent=name;
  document.getElementById('introScreen').style.display='none';
  document.getElementById('quizScreen').style.display='block';
  renderQ();
}
function syncResName(){
  document.getElementById('resName').value=document.getElementById('resName2').value;
}
function esc(s){
  if(!s)return'';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function renderQ(){

  var L=['A','B','C','D'];
  for(var j=0;j<q.o.length;j++){

    if(ans!==undefined){
      dis='disabled';
      if(j===q.a)cls+=' correct';
      else if(j===ans&&ans!==q.a)cls+=' wrong';
    }
    html+='<button class="'+cls+'" '+dis+' onclick="checkAns('+j+')"><strong>'+L[j]+')</strong> '+esc(q.o[j])+'</button>';
  }
  html+='</div>';
  html+='<div class="exp-box'+(state.answered[i]!==undefined?' show':'')+'" id="expBox">'+esc(q.exp)+'</div>';
  document.getElementById('qCard').innerHTML=html;
  var done=state.answered[i]!==undefined;
  document.getElementById('btnBack').disabled=(i===0||!done);
  document.getElementById('btnNext').disabled=(!done||i===Q.length-1);
  document.getElementById('qMeta').textContent='Soru '+(i+1)+' / '+Q.length;
  document.getElementById('progFill').style.width=((i+1)/Q.length*100)+'%';
  document.getElementById('cntOk').textContent=state.okCount+' Doğru';
  document.getElementById('cntErr').textContent=state.errCount+' Yanlış';
}
function checkAns(j){
  var i=state.cur;
  if(state.answered[i]!==undefined)return;
  var q=Q[i];state.answered[i]=j;
  if(j===q.a){state.okCount++;state.scores[i]=1;}
  else{state.errCount++;state.scores[i]=0;}
  renderQ();
}
function goNext(){if(state.cur<Q.length-1){state.cur++;renderQ();}}
function goBack(){if(state.cur>0){state.cur--;renderQ();}}
function confirmFinish(){
  var answered=0;for(var i=0;i<Q.length;i++){if(state.answered[i]!==undefined)answered++;}
  var unanswered=Q.length-answered;
  var msg='Toplam '+Q.length+' sorudan '+answered+' tanesini cevapladınız.';
  if(unanswered>0)msg+='\n\n'+unanswered+' soru cevapsız kalacak (0 puan).';
  msg+='\n\nTesti bitirmek istediğinize emin misiniz?';
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('confirmOverlay').style.display='flex';
}
function closeConfirm(){document.getElementById('confirmOverlay').style.display='none';}
function doFinish(){closeConfirm();showResult();}
function showResult(){
  document.getElementById('quizScreen').style.display='none';
  document.getElementById('resultScreen').style.display='block';
  var total=0;for(var i=0;i<Q.length;i++){total+=(state.scores[i]||0);}
  var pct=total*2;if(pct>100)pct=100;
  document.getElementById('resScore').textContent=pct;
  document.getElementById('resOk').textContent=state.okCount+' Doğru';
  document.getElementById('resErr').textContent=state.errCount+' Yanlış';
  document.getElementById('resNote').textContent='50 sorudan '+state.okCount+' tanesi doğru (her soru 2 puan)';
  var rev=document.getElementById('reviewList');
  var L=['A','B','C','D'];var html2='';
  for(var i=0;i<Q.length;i++){
    var ans=state.answered[i];
    if(ans===undefined||ans===Q[i].a)continue;
    var q=Q[i];
    html2+='<div class="rev-item">';
    html2+='<div class="rev-q">'+esc(q.q)+'</div>';
    html2+='<div class="rev-chosen">Verdiğiniz cevap: '+L[ans]+') '+esc(q.o[ans])+'</div>';
    html2+='<div class="rev-correct">Doğru cevap: '+L[q.a]+') '+esc(q.o[q.a])+'</div>';
    html2+='<div class="rev-exp">'+esc(q.exp)+'</div>';
    html2+='</div>';
  }
  rev.innerHTML=html2||'<div style="padding:.5rem;color:#666">Yanlış soru bulunamadı.</div>';
}
function toggleReview(){
  var rv=document.getElementById('reviewList');
  rv.style.display=(rv.style.display==='flex'?'none':'flex');
}
function submitResult(){
  var name=document.getElementById('resName').value;
  if(!name){alert('Lütfen adınızı seçin.');return;}
  var total=0;for(var i=0;i<Q.length;i++){total+=(state.scores[i]||0);}
  var pct=total*2;if(pct>100)pct=100;
  var grup=GROUPS[name]||'A1.1';
  var jsonPayload=JSON.stringify({
    ogrenci:name,odev:ODEV_ADI,grup:grup,
    puan:pct,dogru:state.okCount,yanlis:state.errCount,
    tarih:new Date().toLocaleDateString('tr-TR')
  });
  document.getElementById('submitWarning').style.display='none';
  document.getElementById('submitMsg').style.display='block';
  document.getElementById('submitMsg').style.background='#fff3cd';
  document.getElementById('submitMsg').style.color='#856404';
  document.getElementById('submitMsg').style.border='1px solid #ffc107';
  document.getElementById('submitMsg').textContent='Gönderiliyor... (Grup: '+grup+')';
  document.getElementById('btnSubmit').disabled=true;
  var msgEl=document.getElementById('submitMsg');
  fetch(SCRIPT_URL,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'data='+encodeURIComponent(jsonPayload)
  })
  .then(function(){
    msgEl.style.background='#e6f9f0';
    msgEl.style.color='#1a5c3a';
    msgEl.style.border='1px solid #b8f0d8';
    msgEl.textContent=name+' öğrencisinin "“'+ODEV_ADI+'” ödevi teslim edildi. Puan: '+pct+'/100.';
  })
  .catch(function(err){
    msgEl.style.background='#fde8e8';
    msgEl.style.color='#8b1a1a';
    msgEl.style.border='1px solid #d94040';
    msgEl.textContent='HATA: '+err.message;
    document.getElementById('btnSubmit').disabled=false;
  });
}
</script>
</body>
</html>
